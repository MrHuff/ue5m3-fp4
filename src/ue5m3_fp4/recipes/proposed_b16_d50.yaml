schema_version: 1
name: proposed_ue5m3_b16_d50
block_size: 16
payload_format: E2M1
scale_format: UE5M3
scale_target: 448.0
delayed_scale_interval: 50
activation_rounding: ties_to_even
weight_rounding: ties_to_even
upstream_gradient_rounding: stochastic_8bit_midpoint
scale_rounding: ties_to_even
two_dimensional_weights: true
randomized_hadamard_transform: false
scale_target_overrides:
