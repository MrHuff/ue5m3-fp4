[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ue5m3-fp4"
version = "0.2.0a0"
description = "UE5M3 FP4 numerical kernels and public language model pretraining reproduction"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Robert Hu" },
  { name = "Carlo Luschi" },
  { name = "Paul Balanca" },
]
maintainers = [
  { name = "Robert Hu", email = "robert.stats.hu@gmail.com" },
]
keywords = [
  "FP4",
  "UE5M3",
  "block scaling",
  "language model",
  "low-precision training",
  "quantization",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "PyYAML>=6.0",
  "torch>=2.7",
  "safetensors>=0.4",
]

[project.urls]
Repository = "https://github.com/MrHuff/ue5m3-fp4"
Issues = "https://github.com/MrHuff/ue5m3-fp4/issues"

[project.optional-dependencies]
dev = [
  "build==1.3.0",
  "datasets>=2.21.0",
  "fsspec",
  "pytest>=8",
  "ruff==0.12.11",
  "tensorboard",
  "tokenizers",
  "torchdata>=0.8.0",
  "tyro",
]
results = [
  "matplotlib==3.10.7",
]

[project.scripts]
ue5m3-fp4-evaluate = "ue5m3_fp4.cli.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ue5m3_fp4.recipes" = ["*.yaml", "inference/*.yaml"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py311"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "RUF022",
  "SIM102",
  "SIM118",
  "TRY004",
  "UP037",
]
