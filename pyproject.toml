[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ue5m3-fp4"
version = "0.1.0a0"
description = "Reference UE5M3 block scaling for FP4 training and quantized evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
maintainers = [
  { name = "Robert Hu", email = "roberthu@graphcore.ai" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "PyYAML>=6.0",
  "torch>=2.7",
  "safetensors>=0.4",
]

[project.urls]
Repository = "https://github.com/MrHuff/ue5m3-fp4"
Issues = "https://github.com/MrHuff/ue5m3-fp4/issues"

[project.optional-dependencies]
dev = [
  "build==1.3.0",
  "pytest>=8",
  "ruff==0.12.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ue5m3_fp4.recipes" = ["*.yaml", "inference/*.yaml"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "RUF022",
  "SIM102",
  "SIM118",
  "TRY004",
  "UP037",
]
