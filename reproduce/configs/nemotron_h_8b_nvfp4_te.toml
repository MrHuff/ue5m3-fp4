# Runnable public method reconstruction; not a byte-identical historical config.
# Requires Transformer Engine 2.16.0.dev0+01aef4fc and NVFP4-capable Blackwell.
# The named converter fixes native current-tensor D=1 scaling, RHT, stochastic
# upstream-gradient rounding, 2D weight scaling, and the final-eight-block BF16
# exemption. It fails closed instead of selecting a software fallback.

[job]
custom_config_module = "ue5m3_fp4.integrations.torchtitan.config"
dump_folder = "REPLACE_WITH_OUTPUT_DIRECTORY/nvfp4-te"
description = "Nemotron-H 8B native Transformer Engine NVFP4 baseline"
print_config = true
save_config_file = "resolved_config.json"

[profiling]
enable_profiling = false
save_traces_folder = "profile_trace"
profile_freq = 10000

[metrics]
log_freq = 25
enable_tensorboard = true
save_tb_folder = "tb"
save_for_all_ranks = false

[debug]
seed = 42
deterministic = false

[model]
name = "nemotron_h_ue5m3"
flavor = "8B_reported"
hf_assets_path = "REPLACE_WITH_PINNED_NEMOTRON_H_ASSETS"
converters = ["ue5m3_fp4.native_nvfp4_te"]

[optimizer]
name = "AdamW"
lr = 0.0008
beta1 = 0.9
beta2 = 0.95
eps = 1.0e-8
weight_decay = 0.1
implementation = "fused"

[training]
dtype = "bfloat16"
mixed_precision_param = "bfloat16"
mixed_precision_reduce = "float32"
local_batch_size = 1
global_batch_size = 768
seq_len = 8192
max_norm = 1.0
steps = 30000
dataset = "ue5m3_public_olmo_mix_1124"
enable_cpu_offload = false
gc_freq = 50

[public_data]
root = "REPLACE_WITH_PREPARED_OLMO_MIX_ROOT"
dclm_weight = 0.82
no_dclm_weight = 0.18
expected_shards_per_stream = 32
text_column = "text"
cycle = true
strict_inventory = true

[compile]
enable = true
components = ["loss"]
backend = "inductor"

[lr_scheduler]
warmup_steps = 0
decay_ratio = 0.15
decay_type = "linear"
min_lr_factor = 0.01

[parallelism]
pipeline_parallel_degree = 1
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
tensor_parallel_degree = 1
context_parallel_degree = 1

[checkpoint]
enable = true
folder = "checkpoint"
interval = 2500
keep_latest_k = 0
last_save_model_only = false
export_dtype = "bfloat16"
async_mode = "async"

[activation_checkpoint]
mode = "none"
selective_ac_option = "op"

[validation]
enable = false

[experimental]
custom_import = "ue5m3_fp4.integrations.torchtitan.plugin"

[comm]
init_timeout_seconds = 900
train_timeout_seconds = 900
