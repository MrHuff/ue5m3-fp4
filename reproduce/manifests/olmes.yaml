suites:
  - core_9mcqa::olmes
  - mmlu::olmes
  - mmlu_pro:mc::none

execution:
  task_order: ascending frozen request-bundle task_index 0 through 145
  within_task_order: >-
    pinned HFLM_Verbose collator key ordered by negative concatenated-token
    count then concatenated token IDs, stable for ties
  batch_size: 8
  partial_final_batch: allowed only at the end of an individual leaf task
  expected_forward_work_units: 46136
  work_unit: one top-level NemotronHForCausalLM forward on one consecutive collator batch
  gpus: 1
  workers: 1
  processes: 1
  logits_cache: false
  maximum_length: 2048
  random_subsample_seed: 20260830
  global_limit: null
  preserve_official_per_task_limits: true

d50_inference:
  applicable_configurations:
    - ue5m3_proposed_b16
    - ue5m3_proposed_b32
    - ue5m3_torch_control
  initial_activation_cache: cold after checkpoint load
  checkpoint_cache_inherited: false
  weight_amax: sampled once after load and frozen
  refresh_interval_forward_work_units: 50
  one_based_refresh_work_units: 1, 51, 101, ...
  counter_scope: one entire 146-task process
  reset_between_tasks: false
  warning: >-
    This is a deterministic OLMES forward-batch replay, not an optimizer-step
    replay and not a reconstruction of an unsaved training cache.

