schema: ue5m3_fp4_public_reproduction_manifest
version: 1

provenance:
  status: reconstructed
  verbatim_historical_config: false
  explanation: >-
    The public TOMLs combine surviving base configurations with the effective
    30k launcher overrides and the adapters recorded by the completed
    evaluation manifests. They are not byte-for-byte copies of the historical
    resolved config-rank0 files.
  strict_rerun_requirement: >-
    Store the fully resolved per-rank-zero configuration, command line,
    environment allowlist, source revision, and SHA-256 digests beside every
    newly generated checkpoint.
  omitted_from_public_bundle:
    - private object-store addresses
    - cluster scheduler templates and job identifiers
    - credentials and environment files
    - private dataset manifests and checkpoint objects

model:
  implementation_name: nemotron_h_gc
  flavor: 8B_paper
  family: Nemotron-H
  parameter_count: 8084075520
  vocabulary_size: 131072
  hidden_size: 4096
  intermediate_size: 21504
  num_hidden_layers: 52
  hybrid_override_pattern: M-M-M-M*-M-M-M-M-M*-M-M-M-M-M*-M-M-M-M-M*-M-M-M-M-M-
  num_attention_heads: 32
  num_key_value_heads: 4
  head_dim: 128
  max_position_embeddings: 8192
  attention_bias: false
  attention_dropout: 0.0
  hidden_dropout: 0.0
  mlp_bias: false
  mlp_hidden_activation: relu2
  tie_word_embeddings: false
  layer_norm_epsilon: 1.0e-5
  residual_in_fp32: false
  initializer_range: 0.02
  rescale_prenorm_residual: true
  mamba:
    state_size: 128
    num_heads: 128
    head_dim: 64
    groups: 8
    convolution_kernel: 4
    activation: silu
    time_step_min: 0.001
    time_step_max: 0.1
    time_step_floor: 0.0001
    convolution_bias: true
    projection_bias: false
    chunk_size: 256
  fp4_eligible_linears: 112
  output_head:
    eligible_for_fp4: false
    evaluation_precision: float32

common_training:
  seed: 42
  independent_runs_per_configuration: 1
  optimizer:
    name: AdamW
    learning_rate: 0.0008
    beta1: 0.9
    beta2: 0.95
    weight_decay: 0.1
  scheduler:
    warmup_steps: 0
    decay_type: linear
    decay_ratio: 0.15
    minimum_learning_rate_factor: 0.01
  dtype: bfloat16
  local_batch_size: 1
  global_batch_size: 768
  sequence_length: 8192
  optimizer_steps: 30000
  nominal_input_tokens: 188743680000
  maximum_gradient_norm: 1.0
  cross_entropy:
    cut_cross_entropy: false
    compiled_torch_cross_entropy: true
  activation_checkpointing: none
  checkpoint:
    interval_steps: 2500
    expected_steps: [2500, 5000, 7500, 10000, 12500, 15000, 17500, 20000, 22500, 25000, 27500, 30000]
    keep_all: true
    learned_weight_dtype: bfloat16
    delayed_amax_cache_serialized: false
  historical_topology:
    nodes: 8
    gpus_per_node: 4
    gpu: NVIDIA GB200
    data_parallel_shard_degree: -1
    data_parallel_replicate_degree: 1
    tensor_parallel_degree: 1
    pipeline_parallel_degree: 1
    note: >-
      Gradient accumulation supplied the global batch of 768. A different
      topology is not a hardware-identical reproduction.

data:
  historical_dataset_adapter: mosaic/shuffled-olmo-mix-1124
  public_dataset_adapter: ue5m3_public_olmo_mix_1124
  public_prepared_root: REPLACE_WITH_PREPARED_OLMO_MIX_ROOT
  streams:
    - name: dclm
      proportion: 0.82
      public_path: REPLACE_WITH_PREPARED_OLMO_MIX_ROOT/dclm
    - name: olmo-no-dclm
      proportion: 0.18
      public_path: REPLACE_WITH_PREPARED_OLMO_MIX_ROOT/olmo-no-dclm
  split: train
  shuffle: false
  historical_dataloader_workers: 2
  public_dataloader_workers: 0
  node_distribution: shard
  exact_historical_order_publicly_available: false

model_assets:
  source_identifier: NVIDIA-Nemotron-Nano-12B-v2-Base
  local_path: REPLACE_WITH_PINNED_NEMOTRON_H_ASSETS
  exact_historical_asset_digest_recorded_here: false
  requirement: >-
    Freeze the tokenizer files, configuration, remote-code files, source
    revision, and content digests before a rerun.

experiments:
  - key: bf16
    config: ../configs/nemotron_h_8b_bf16.toml
    public_runnable: true
    training_path: learned BF16 weights
    fp4_quantization_applied: false
    validation_protocol: learned_weight_bf16

  - key: ue5m3_proposed_b16
    config: ../configs/nemotron_h_8b_ue5m3_b16.toml
    public_runnable: true
    training_path: probe-matched UE5M3 FP4
    payload: E2M1
    block_scale: unsigned E5M3
    block_size: 16
    eligible_linears_in_fp4: 112
    bf16_exempt_final_blocks: 0
    training_refresh_interval_optimizer_steps: 50
    validation_protocol: fp4_activation_cold_replay_d50

  - key: ue5m3_proposed_b32
    config: ../configs/nemotron_h_8b_ue5m3_b32.toml
    public_runnable: true
    training_path: probe-matched UE5M3 FP4
    payload: E2M1
    block_scale: unsigned E5M3
    block_size: 32
    eligible_linears_in_fp4: 112
    bf16_exempt_final_blocks: 0
    training_refresh_interval_optimizer_steps: 50
    validation_protocol: fp4_activation_cold_replay_d50

  - key: ue5m3_torch_control
    config: ../configs/nemotron_h_8b_ue5m3_torch_control.toml
    public_runnable: true
    historical_spec: ../historical_specs/nemotron_h_8b_ue5m3_torch_control.toml
    training_path: encoded FP4 operands with generic Torch FP32 matmul
    block_size: 16
    differs_from_ue5m3_proposed_b16:
      - fake_gemm_backend=torch
      - fake_gemm_backend_wgrad=torch
      - use_fp32_matmul=true
    validation_protocol: fp4_activation_cold_replay_d50

  - key: ue5m3_transformer_engine_settings
    config: ../configs/nemotron_h_8b_ue5m3_te_settings.toml
    public_runnable: true
    historical_spec: ../historical_specs/nemotron_h_8b_ue5m3_te_settings.toml
    training_path: probe-matched UE5M3 with Transformer Engine recipe settings
    block_size: 16
    eligible_linears_in_fp4: 96
    bf16_exempt_final_blocks: 8
    randomized_hadamard_transform:
      forward_gemm: false
      data_gradient_gemm: false
      weight_gradient_upstream_gradient_dy_t: true
      weight_gradient_saved_activation_x_t: true
      weights: false
      block_size: 16
    training_refresh_interval_optimizer_steps: 1
    validation_protocol: fp4_current_tensor_d1
    checkpoint_note: >-
      The validation study admitted a complete audited log-checkpoint mirror
      because the historical canonical checkpoint root was incomplete. A public
      rerun should produce a normal complete checkpoint directly.

  - key: native_transformer_engine_nvfp4
    config: ../configs/nemotron_h_8b_nvfp4_te.toml
    public_runnable: true
    historical_spec: ../historical_specs/nemotron_h_8b_nvfp4_te.toml
    training_path: native Transformer Engine NVFP4
    payload: E2M1
    block_scale: signed E4M3
    block_size: 16
    eligible_linears_in_fp4: 96
    bf16_exempt_final_blocks: 8
    training_refresh_interval_optimizer_steps: 1
    validation_protocol: native_transformer_engine_current_tensor_d1
    trajectory_note: >-
      The reported trajectory used an initial run through step 15000 and a
      resumed run for later checkpoints. Model, optimizer, scheduler, and
      counters were restored; the dataloader/RNG stream restarted at resume.

  - key: native_nvfp4_no_rht_all_linears
    config: ../configs/nemotron_h_8b_nvfp4_no_rht_all_linears.toml
    public_runnable: true
    historical_spec: ../historical_specs/nemotron_h_8b_nvfp4_no_rht_all_linears.toml
    training_path: native Transformer Engine NVFP4 ablation
    eligible_linears_in_fp4: 112
    bf16_exempt_final_blocks: 0
    randomized_hadamard_transform: false
    recorded_requested_refresh_interval: 50
    public_runtime_refresh_interval: 1
    audited_evaluation_refresh_interval: 1
    validation_protocol: native_transformer_engine_current_tensor_d1
    warning: >-
      The production v12 Transformer Engine runtime exposed no delayed-amax
      setter, getter, or reset API. The recorded extension fields were inert in
      the audited evaluation runtime, which used current-tensor D=1 scaling.

historical_runtime_pins:
  container:
    reference: ghcr.io/mrhuff/fp4-training:v12
    digest: sha256:dfe6f1cd1cad8701a5bf10cd9730dbea18c0b21e757a0393f141655894fc29af
    publicly_distributed: false
    purpose: historical provenance only; use reproduce/Dockerfile for public reruns
  torchtitan:
    commit: e37f83f58b35fdbceed9a5916b3490c16247ac9c
  transformer_engine:
    version: 2.16.0.dev0+01aef4fc
    commit: 01aef4fc721bd12fd09cd56d53a314aee1b953d6
    two_x_acc_wgrad: false
    two_x_acc_dgrad: false
  thunderkittens:
    commit: 792800534da7f0e15a9c5c4c835575521d2f973c
  cudnn_frontend:
    commit: 97f6cb3b88cacff507cca1280db5650a457d92b3
  cutlass:
    commit: 57e3cfb47a2d9e0d46eb6335c3dc411498efa198
  runtime_wheel_manifest_sha256: b2418f4f7c44d6336b3f8ef42242b9ab7294c2f09ff44638a546a7f615e0ec18

limitations:
  - The private dataset order and original checkpoint objects are not bundled.
  - The exact historical resolved config-rank0 files are not bundled.
  - Each configuration has one independent training trajectory.
  - The probe-matched GEMM is a software numerical model, not native UE5M3 hardware.
  - Native NVFP4 requires Blackwell hardware and the pinned Transformer Engine runtime.
  - The local runtime benchmark launcher underlying the reported throughput JSON was not recovered as a standalone public script.
