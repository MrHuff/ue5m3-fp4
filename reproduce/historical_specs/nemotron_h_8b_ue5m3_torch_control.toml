# RECORD-ONLY HISTORICAL RECONSTRUCTION, not a runnable or verbatim config-rank0.
# The released control uses encoded Triton operand quantization followed by a
# Torch FP32 matrix multiplication and global decode.

[job]
dump_folder = "REPLACE_WITH_OUTPUT_DIRECTORY/ue5m3-torch-control"
remote_folder = ""
description = "Nemotron-H 8B UE5M3 B=16 generic Torch GEMM control"

[profiling]
enable_profiling = false
save_traces_folder = "profile_trace"
profile_freq = 10000

[metrics]
log_freq = 25
enable_tensorboard = true
save_tb_folder = "tb"
distributed_mode = "local_rank_0"

[debug]
seed = 42

[model]
name = "nemotron_h_gc"
flavor = "8B_paper"
hf_assets_path = "REPLACE_WITH_PINNED_NEMOTRON_H_ASSETS"
use_flex_attn = false
converters = ["mxfp_custom"]

[optimizer]
name = "AdamW"
lr = 0.0008
beta1 = 0.9
beta2 = 0.95
weight_decay = 0.1

[training]
dtype = "bfloat16"
local_batch_size = 1
global_batch_size = 768
seq_len = 8192
max_norm = 1.0
steps = 30000
dataset = "mosaic/shuffled-olmo-mix-1124"
dataset_path = '{"streams":[{"name":"dclm","path":"REPLACE_WITH_DCLM_MOSAIC_STREAM","proportion":0.82},{"name":"olmo-no-dclm","path":"REPLACE_WITH_OLMO_NO_DCLM_MOSAIC_STREAM","proportion":0.18}]}'
load_dataset_kwargs = '{"split":"train","shuffle":false,"num_workers":2}'
dataset_node_distribution = "shard"
enable_cce = false
compile_ce = true
compile = false

[compile]
enable = false
components = ["model", "loss"]

[lr_scheduler]
warmup_steps = 0
decay_ratio = 0.15
decay_type = "linear"
min_lr_factor = 0.01

[parallelism]
pipeline_parallel_degree = 1
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
tensor_parallel_degree = 1

[checkpoint]
enable = true
folder = "checkpoint"
interval = 2500
keep_latest_k = 0
export_dtype = "float32"
async_mode = "async"

[activation_checkpoint]
mode = "none"
selective_ac_option = "op"

[mxfp_custom]
block_size = 16
elem_dtype = "fp4_e2m1"
scale_type = "E5M3"
scale_max = 448.0
scale_max_activations = 448.0
scale_max_weights = 448.0
strategy = "decode"
nan_handling_mode = "to_one"
mlp_recipe = "Custom"
attn_recipe = "Custom"
exclude_last_n_layers = 0
exclude_qkv = false
quantize_mamba = true
use_global_scale = true
use_global_amax = true
use_global_scale_final_n_layers = 0
use_2d_weights = true
use_bf16_data = true
use_fp32_scaling = true
use_encoded_gemm = true
use_fp32_matmul = true
fake_gemm_backend = "torch"
fake_gemm_backend_wgrad = "torch"
fake_gemm_pad_to_tk_tiles = false
fake_gemm_issue_rz_k_tile = 64
fake_gemm_issue_rz_final_grid_denom = 1024
use_rht = false
use_rht_activations = false
use_rht_weights = false
use_rht_gradients = false
rht_algo = "fwht"
roundMode = "TiesToEven"
round_mode_activations = "TiesToEven"
round_mode_weights = "TiesToEven"
round_mode_gradients = "StochasticFast"
round_mode_gradients_dgrad = "StochasticFast"
round_mode_gradients_wgrad = "StochasticFast"
scale_round_mode = "TiesToEven"
scale_round_mode_activations = "TiesToEven"
scale_round_mode_weights = "TiesToEven"
scale_round_mode_gradients = "TiesToEven"
delayed_amax_safety_factor = 1.0
delayed_amax_interval = 50
delayed_amax_interval_activations = 0
delayed_amax_interval_weights = 0
delayed_amax_interval_gradients = 0
delayed_amax_paths = "activations,weights,gradients"
verbose = true

[comm]
init_timeout_seconds = 900
train_timeout_seconds = 900
